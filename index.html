<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Life Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" title="Ganti tema">🌙</button>

  <div class="dashboard">

    <!-- GREETING -->
    <section class="card greeting-card">
      <div class="greeting-text">
        <h1 id="greeting">Halo!</h1>
        <p id="dateTime" class="datetime"></p>
      </div>
      <div class="name-form">
        <input type="text" id="nameInput" placeholder="Siapa nama kamu?">
        <button id="saveNameBtn">Simpan</button>
      </div>
    </section>

    <div class="grid">

      <!-- FOCUS TIMER -->
      <section class="card timer-card">
        <h2>⏱️ Focus Timer</h2>
        
        <div id="timerView">
          <div class="timer-display" id="timerDisplay">25:00</div>

          <div class="timer-settings">
            <label for="durationInput">Durasi (menit):</label>
            <input type="number" id="durationInput" min="1" max="120" value="25">
            <button id="applyDurationBtn">Terapkan</button>
          </div>

          <div class="timer-buttons">
            <button id="startBtn" class="btn-primary">Start</button>
            <button id="stopBtn" class="btn-secondary">Stop</button>
            <button id="resetBtn" class="btn-secondary">Reset</button>
          </div>
        </div>

        <div id="congratsView" style="display: none;">
          <div class="congrats-message">
            <div class="congrats-icon">🎊</div>
            <br>
            <h3>Selamat!</h3>
            <br>
            <p>Kamu telah menyelesaikan sesi fokus!</p>
            <br>
            <div class="congrats-buttons">
              <button id="dismissBtn" class="btn-secondary">Tutup</button>
              <button id="newFocusBtn" class="btn-primary">Fokus Lagi</button>
            </div>
          </div>
        </div>
      </section>

      <!-- QUICK LINKS -->
      <section class="card links-card">
        <h2>🔗 Quick Links</h2>
        <div id="linksList" class="links-list"></div>

        <form id="linkForm" class="link-form">
          <input type="text" id="linkName" placeholder="Nama situs" required>
          <input type="url" id="linkUrl" placeholder="https://example.com" required>
          <button type="submit">+ Tambah</button>
        </form>
      </section>

    </div>

    <!-- TODO LIST -->
    <section class="card todo-card">
      <div class="todo-header">
        <h2>✅ To-Do List</h2>
        <select id="sortSelect">
          <option value="default">Urutan default</option>
          <option value="az">A - Z</option>
          <option value="za">Z - A</option>
          <option value="done">Belum selesai dulu</option>
        </select>
      </div>

      <form id="todoForm" class="todo-form">
        <input type="text" id="todoInput" placeholder="Tambah tugas baru..." required>
        <button type="submit">Tambah</button>
      </form>

      <ul id="todoList" class="todo-list"></ul>
      <p id="todoEmpty" class="empty-msg">Belum ada tugas. Tambahkan satu di atas! 🎉</p>
    </section>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
